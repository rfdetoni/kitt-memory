name: Automatic Release

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automatic-release-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated Memory commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Validate and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git fetch --no-tags origin main
          head="$(git rev-parse HEAD)"
          main_head="$(git rev-parse origin/main)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" && "$head" != "$main_head" ]]; then
            echo "Validated SHA $head is stale versus main $main_head; skipping."
            exit 0
          fi
          current="$(python - <<'PY'
          import re, tomllib
          from pathlib import Path
          cargo = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", cargo): raise SystemExit(f"invalid semver: {cargo}")
          lock = Path("Cargo.lock").read_text()
          for package in ("kitt-memory-core", "kitt-memory-sqlite", "kitt-memoryd"):
              m = re.search(rf'(?ms)^name = "{re.escape(package)}"\nversion = "([^"]+)"', lock)
              if not m: raise SystemExit(f"{package} missing from Cargo.lock")
              if m.group(1) != cargo: raise SystemExit(f"version mismatch: workspace={cargo} {package}={m.group(1)}")
          print(cargo)
          PY
          )"
          tag="v$current"
          tagged="$(git rev-list -n1 "$tag" 2>/dev/null || true)"
          if [[ -n "$tagged" && "$tagged" != "$head" ]]; then
            if ! git merge-base --is-ancestor "$tagged" "$head"; then
              echo "Immutable tag $tag at $tagged is not an ancestor of validated main $head." >&2
              exit 1
            fi
            publishable=()
            while IFS= read -r path; do
              case "$path" in
                .github/*|docs/*|tests/*|*/tests/*|README.md|README.pt-BR.md|LICENSE|SECURITY.md) ;;
                *) publishable+=("$path") ;;
              esac
            done < <(git diff --name-only "$tagged..$head")
            if (( ${#publishable[@]} )); then
              printf 'Same-version main contains publishable changes that require a version bump:\n' >&2
              printf '  %s\n' "${publishable[@]}" >&2
              exit 1
            fi
            echo "Validated main differs from $tag only in tests/docs/workflows; no package release is required."
            exit 0
          fi
          if [[ -z "$tagged" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/$tag" -f sha="$head" >/dev/null
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" --target "$head" --title "$tag" --generate-notes
          fi
