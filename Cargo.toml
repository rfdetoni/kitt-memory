[workspace]
resolver = "2"
members = ["crates/kitt-memory-core", "crates/kitt-memory-sqlite", "apps/kitt-memoryd"]

[workspace.package]
version = "0.9.3"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
hex = "0.4"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
